appId: com.almas.jewelryerp
productName: Al Zahid Jewelry ERP
copyright: Copyright © Al Zahid Jewelry

directories:
  output: release
  buildResources: build

afterPack: ./afterPack.cjs

files:
  - dist/**/*
  - package.json

extraResources:
  - from: pack-stage/api
    to: api
    filter:
      - "**/*"
      - "!node_modules/**"
  - from: pack-stage/web
    to: web
    filter:
      - "**/*"
      - "!node_modules/**"
  - from: pack-stage/SETUP.txt
    to: SETUP.txt
  - from: pack-stage/CLIENT-INSTALL.txt
    to: CLIENT-INSTALL.txt

# Drop unused Chromium locale packs (~40MB)
electronLanguages:
  - en-US
  - en-GB

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Al Zahid Jewelry ERP
