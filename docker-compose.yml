services:
  mysql:
    image: mysql:8.4
    container_name: jewelry-erp-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jewelry_erp
    volumes:
      - jewelry_erp_mysql:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  jewelry_erp_mysql:
